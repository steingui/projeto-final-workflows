version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: workflow_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build: .
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://0.0.0.0:5000
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    volumes:
      - mlflow_artifacts:/app/mlflow-artifacts
    command: mlflow server --backend-store-uri postgresql://postgres:postgres@db:5432/mlflow_db --default-artifact-root /app/mlflow-artifacts --host 0.0.0.0 --port 5000 --allowed-hosts *
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  prefect-server:
    build: .
    container_name: prefect_server
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://postgres:postgres@db:5432/prefect_db
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
      - PREFECT_SERVER_ANALYTICS_ENABLED=false
      - PREFECT_SQLALCHEMY_POOL_TIMEOUT=60
      - PREFECT_SQLALCHEMY_MAX_OVERFLOW=10
    command: prefect server start
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  prefect-worker:
    build: .
    container_name: prefect_worker
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - .:/app
    command: python run_worker.py
    restart: on-failure
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      db:
        condition: service_healthy

  fastapi-app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      - .:/app
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy

volumes:
  pgdata:
  mlflow_artifacts:
